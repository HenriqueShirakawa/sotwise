name: CI

# `dev` e `main` fazem deploy na Vercel a cada push (dev.sot / sot.gssdatahub.com),
# então o CI roda nas duas: um erro de lint/tipo/teste aparece aqui antes de
# alguém notar em produção.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders só para o `next build` passar. O CI NÃO conecta a lugar
      # nenhum: as páginas com dados são dinâmicas (cookies/sessão) e não são
      # pré-renderizadas, então nenhuma query roda no build. Os segredos reais
      # ficam só na Vercel (Production) e no .env.local (dev).
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
